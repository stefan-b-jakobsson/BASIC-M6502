MEMORY {
    ZP:             start = $0070, size = $008f, define = yes;
    LOWRAM:         start = $00ff, size = $0101, define = yes;
    ROMBANK:        start = $c000, size = $3e90, fill=yes, fillval=$aa;
    JSR_KERNAL:     start = $fe90, size = $30, fill=yes, fillval=$bb;
    KERNAL_VECT:    start = $fec0, size = $140, fill=yes, fillval=$cc;
}
SEGMENTS {
    ZEROPAGE: load = ZP,        type = zp, define=yes;
    PAGE1:    load = LOWRAM,    type = bss, define = yes;
    CODE:     load = ROMBANK,   type = ro, define=yes;
    KTARGET: load = JSR_KERNAL, type = ro, define=yes;
    VECTORS: load = KERNAL_VECT, type=ro, define=yes;
}
